<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INSTANT</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;color:#171717;font-family:Arial,sans-serif}
header{background:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd}
.logo{font-size:27px;font-weight:bold;color:#635bff}
main{max-width:600px;margin:auto;padding:18px}
.card{background:white;padding:22px;border-radius:14px;margin:18px 0}
h2{margin-top:0}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:9px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#635bff;color:white;font-weight:bold}
nav{position:fixed;bottom:0;background:white;width:100%;display:flex;justify-content:space-around;padding:15px;border-top:1px solid #ddd}
nav span{font-size:14px}
</style>
</head>
<body>
<header>
<div class="logo">INSTANT</div>
<div>🌍</div>
</header>
<main>
<div class="card">
<h2>Welcome to INSTANT</h2>
<p>Connect with people. Share your moments. Discover the world.</p>
</div>
<div class="card">
<h2>Create your account</h2>
<input type="text" placeholder="Your full name">
<input type="email" placeholder="Email address">
<input type="tel" placeholder="Phone number">
<input type="password" placeholder="Create password">
<button onclick="alert('Account registration will be connected next.')">Join INSTANT</button>
<p>Already have an account? Sign in</p>
</div>
<div class="card">
<h2>Your world starts here.</h2>
<p>Photos • Videos • Friends • Messages • Shopping</p>
</div>
</main>
<nav>
<span>🏠 Home</span>
<span>🔍 Search</span>
<span>➕ Create</span>
<span>💬 Messages</span>
<span>👤 Profile</span>
</nav>
</body>
</html>
